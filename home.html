<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Home</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body data-page="home">

    <div class="dashboard">

        <aside class="sidebar">
            <div class="brand">Tracking Dashboard</div>
            <nav class="menu">
                <a class="menu-item active" href="home.html">Dashboard</a>
                <a class="menu-item" href="tracking.html">USN Tracking</a>
                <a class="menu-item" href="fa.html">FA Process</a>
                <a class="menu-item" href="rework.html">Rework</a>
                <a class="menu-item" href="warehouse.html">Warehouse</a>
                <a class="menu-item" href="vi.html">VI Process</a>
                <a class="menu-item" href="sma.html">SMA</a>
                <a class="menu-item" href="testing.html">Testing</a>
            </nav>
        </aside>

        <main class="main">

            <header class="topbar">
                <div>
                    <h1>Overall MLB RE Dashboard</h1>
                    <h2 class="sub">Rolex</h2>
                </div>
                <button id="themeToggle" class="theme-btn">🌙 Dark</button>
            </header>

            <section class="cards-grid">
                <div class="card" onclick="goToTracking('all')" style="cursor:pointer;">
                    <h3>Total Units</h3>
                    <p id="totalUnits">0</p>
                </div>

                <div class="card" onclick="goToTracking('completed')" style="cursor:pointer;">
                    <h3>Completed</h3>
                    <p id="completedUnits">0</p>
                </div>

              
                <div class="card" onclick="goToTracking('pending')" style="cursor:pointer;">
                    <h3>Pending</h3>
                    <p id="pendingUnits">0</p>
                </div>

                <div class="card" onclick="goToTracking('fg')" style="cursor:pointer;">
                    <h3>FG</h3>
                    <p id="fgUnits">0</p>
                </div>

                <div class="card" onclick="goToTracking('scrap')" style="cursor:pointer;">
                    <h3>Scrap</h3>
                    <p id="scrapUnits">0</p>
                </div>
            </section>

            <section class="panel">
                <h3>Latest Units</h3>
                <table>
                    <thead>
                        <tr>
                            <th>USN</th>
                            <th>ID</th>
                            <th>Model</th>
                            <th>Current Stage</th>
                            <th>Status</th>
                            <th>Operator</th>

                        </tr>
                    </thead>
                    <tbody id="latestBody"></tbody>
                </table>
            </section>

            <!-- CHART ROW -->
            <section style="display:flex;gap:20px;flex-wrap:wrap;">

                <div class="panel" style="flex:1;">
                    <h3>Stage Summary</h3>
                    <canvas id="barChart"></canvas>
                </div>

                <div class="panel" style="flex:1;">
                    <h3>Stage Distribution</h3>
                    <canvas id="pieChart"></canvas>
                </div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
